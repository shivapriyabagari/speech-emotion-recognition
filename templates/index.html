<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Speech Emotion Recognition</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="logo">🎤</div>

    <h1>Speech Emotion Recognition</h1>

    <p class="subtitle">
        AI-powered emotion detection from human voice
    </p>

    <div class="card">

        <form action="/predict"
              method="POST"
              enctype="multipart/form-data">

            <div class="upload-area">

                <div class="upload-icon">
                    🎧
                </div>

                <h3>
                    Upload your audio
                </h3>

                <p>
                    Select a WAV file to analyze
                </p>

                <input
                    type="file"
                    name="audio"
                    accept=".wav"
                    required
                >

            </div>

            <button type="submit">
                Analyze Emotion
            </button>

        </form>

    </div>

    <div class="footer">
        Speech Emotion Recognition using Machine Learning
    </div>

</div>

</body>

</html>
